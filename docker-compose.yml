version: '3.8'

services:
  tranqui-db:
    image: postgres:15-alpine
    container_name: tranqui-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-tranqui_app}
      POSTGRES_USER: ${DB_USER:-tomaskimmel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tranqui-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  tranqui-backend:
    # Producción: imagen publicada por GitHub Actions al crear el tag (ver docs/flujo/releases.md).
    # build: queda para el deploy manual de emergencia (node deploy.js --compilar).
    image: ghcr.io/tommikimmel/tranqui-backend:${TRANQUI_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tranqui-backend
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tranqui-backend.entrypoints=websecure"
      - "traefik.http.routers.tranqui-backend.rule=Host(`tranquisalud.com`) && (PathPrefix(`/api`) || PathPrefix(`/ws-tranqui`))"
      - "traefik.http.routers.tranqui-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.tranqui-backend.loadbalancer.server.port=8080"
    environment:
      TZ: America/Argentina/Buenos_Aires
      SPRING_DATASOURCE_URL: jdbc:postgresql://tranqui-db:5432/${DB_NAME:-tranqui_app}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-tomaskimmel}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # Sin default: con una clave conocida cualquiera podría descifrar los tokens guardados.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY en .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-224301140079-2pa672f7sqcner9nut04j0g99md88n3p.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_CALENDAR_WATCH_ENABLED: ${GOOGLE_CALENDAR_WATCH_ENABLED:-false}
      MERCADOPAGO_ENABLED: ${MERCADOPAGO_ENABLED:-false}
      MERCADOPAGO_CLIENT_ID: ${MERCADOPAGO_CLIENT_ID:-}
      MERCADOPAGO_CLIENT_SECRET: ${MERCADOPAGO_CLIENT_SECRET:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MP_ADMIN_ACCESS_TOKEN: ${MP_ADMIN_ACCESS_TOKEN:-}
      MP_ADMIN_PUBLIC_KEY: ${MP_ADMIN_PUBLIC_KEY:-}
      PAYMENT_SIMULATION_ENABLED: ${PAYMENT_SIMULATION_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-onboarding@resend.dev}
      NOVEDADES_TOKEN: ${NOVEDADES_TOKEN:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      QBI2_RECIPE_ENABLED: ${QBI2_RECIPE_ENABLED:-false}
      QBI2_RECIPE_ENV: ${QBI2_RECIPE_ENV:-hml}
      QBI2_CLIENTE_APP_ID: ${QBI2_CLIENTE_APP_ID:-}
      QBI2_RECIPE_TOKEN: ${QBI2_RECIPE_TOKEN:-}
      SITE_ACCESS_PASSWORD: ${SITE_ACCESS_PASSWORD:-}
      SEED_TEST_ACCOUNTS: ${SEED_TEST_ACCOUNTS:-false}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      ARCA_ENABLED: ${ARCA_ENABLED:-false}
      ARCA_ENVIRONMENT: ${ARCA_ENVIRONMENT:-homologacion}
      ARCA_CUIT_EMISOR: ${ARCA_CUIT_EMISOR:-20384910294}
      ARCA_PUNTO_VENTA: ${ARCA_PUNTO_VENTA:-1}
      ARCA_CERT_PATH: ${ARCA_CERT_PATH:-}
      ARCA_KEY_PATH: ${ARCA_KEY_PATH:-}
      ARCA_CERT_CONTENT: ${ARCA_CERT_CONTENT:-}
      ARCA_KEY_CONTENT: ${ARCA_KEY_CONTENT:-}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${LOG_LEVEL_SECURITY:-INFO}
    depends_on:
      tranqui-db:
        condition: service_healthy
    networks:
      - tranqui-network

  tranqui-frontend:
    image: ghcr.io/tommikimmel/tranqui-frontend:${TRANQUI_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tranqui-frontend
    restart: always
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      # Modo mantenimiento: carpeta del host fuera de /app (un deploy no la borra). Ver
      # frontend/nginx.conf y docs/entornos/produccion.md. Docker la crea vacía si no existe.
      - /srv/tranqui/mantenimiento:/etc/nginx/mantenimiento:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tranqui-frontend.entrypoints=websecure"
      - "traefik.http.routers.tranqui-frontend.rule=Host(`tranquisalud.com`)"
      - "traefik.http.routers.tranqui-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.tranqui-frontend.loadbalancer.server.port=80"
    networks:
      - tranqui-network
    depends_on:
      - tranqui-backend

volumes:
  pgdata:
    driver: local

networks:
  tranqui-network:
    driver: bridge
