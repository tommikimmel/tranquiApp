  pagos:
    image: ghcr.io/tommikimmel/tranqui-pagos:${TRANQUI_VERSION:-latest}
    build:
      context: .
      dockerfile: services/pagos/Dockerfile
    container_name: tranqui-pagos
    restart: always
    # Fase 8: las suscripciones y facturación viven acá dentro del límite de 288 MB (no se agrega contenedor).
    # La memoria y el trabajo de facturación se miden en la verificación de punta a punta (riesgo de la spec).
    mem_limit: 288m
    cpus: 0.5
    environment:
      TZ: America/Argentina/Buenos_Aires
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:MinRAMPercentage=30 -XX:MaxRAMPercentage=30 -Xss256k -XX:ReservedCodeCacheSize=32m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://tranqui-db:5432/pagos
      SPRING_DATASOURCE_USERNAME: pagos
      SPRING_DATASOURCE_PASSWORD: ${PAGOS_DB_PASSWORD:?Falta PAGOS_DB_PASSWORD en .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-tranqui}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      SERVICE_JWT_KEY: ${SERVICE_JWT_KEY:?Falta SERVICE_JWT_KEY en .env}
      TRANQUI_GATEWAY_URL: http://gateway:8080
      TRANQUI_VERSION: ${TRANQUI_VERSION:-latest}
      # Las mismas variables de Mercado Pago que tenía el monolito (misma aplicación y mismo webhook).
      MERCADOPAGO_ENABLED: ${MERCADOPAGO_ENABLED:-false}
      MERCADOPAGO_CLIENT_ID: ${MERCADOPAGO_CLIENT_ID:-}
      MERCADOPAGO_CLIENT_SECRET: ${MERCADOPAGO_CLIENT_SECRET:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      PAYMENT_SIMULATION_ENABLED: ${PAYMENT_SIMULATION_ENABLED:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # La misma clave que el monolito: los tokens de Mercado Pago se leen en los dos.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Falta ENCRYPTION_KEY en .env}
      # Fase 8: carga inicial y atención de suscripciones, planes y facturación. Default false hasta el corte en mantenimiento.
      PAGOS_SUSCRIPCIONES: ${PAGOS_SUSCRIPCIONES:-false}
      # Fase 8: Mercado Pago de la plataforma para suscripciones (mismas variables y defaults que el monolito).
      MP_ADMIN_ACCESS_TOKEN: ${MP_ADMIN_ACCESS_TOKEN:-}
      MP_ADMIN_PUBLIC_KEY: ${MP_ADMIN_PUBLIC_KEY:-}
      # Fase 8: facturación ARCA (las mismas variables y defaults que el monolito; sigue apagada).
      ARCA_ENABLED: ${ARCA_ENABLED:-false}
      ARCA_ENVIRONMENT: ${ARCA_ENVIRONMENT:-homologacion}
      ARCA_CUIT_EMISOR: ${ARCA_CUIT_EMISOR:-20384910294}
      ARCA_PUNTO_VENTA: ${ARCA_PUNTO_VENTA:-1}
      ARCA_CERT_PATH: ${ARCA_CERT_PATH:-}
      ARCA_KEY_PATH: ${ARCA_KEY_PATH:-}
      ARCA_CERT_CONTENT: ${ARCA_CERT_CONTENT:-}
      ARCA_KEY_CONTENT: ${ARCA_KEY_CONTENT:-}
    # Volumen para certificados ARCA: el monolito no monta volumen en producción (resuelve por variables
    # o paths locales); cuando se defina la ubicación definitiva en producción se montará acá de solo lectura
    # (ver docs/cambios-a-futuro.md punto 4).
    # volumes:
    #   - /etc/tranqui/arca:/etc/tranqui/arca:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # Arranque escalonado (sección 9.3): una JVM detrás de la otra.
    depends_on:
      db-servicios:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
      gateway:
        condition: service_healthy
      calendario:
        condition: service_healthy
    networks:
      tranqui-network:
        aliases:
          - tranqui-pagos

  profesionales:
    image: ghcr.io/tommikimmel/tranqui-profesionales:${TRANQUI_VERSION:-latest}
    build:
      context: .
      dockerfile: services/profesionales/Dockerfile
    container_name: tranqui-profesionales
    restart: always
    # Fase 7: no se agrega ningún contenedor; historia clínica y recetas viven acá dentro del límite de 288 MB.
    mem_limit: 288m
    cpus: 0.5
    environment:
      TZ: America/Argentina/Buenos_Aires
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:MinRAMPercentage=30 -XX:MaxRAMPercentage=30 -Xss256k -XX:ReservedCodeCacheSize=32m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://tranqui-db:5432/profesionales
      SPRING_DATASOURCE_USERNAME: profesionales
      SPRING_DATASOURCE_PASSWORD: ${PROFESIONALES_DB_PASSWORD:?Falta PROFESIONALES_DB_PASSWORD en .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-tranqui}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      SERVICE_JWT_KEY: ${SERVICE_JWT_KEY:?Falta SERVICE_JWT_KEY en .env}
      TRANQUI_GATEWAY_URL: http://gateway:8080
      TRANQUI_VERSION: ${TRANQUI_VERSION:-latest}
      # El mismo flag que el monolito: con Mercado Pago real, el buscador exige la cuenta vinculada.
      MERCADOPAGO_ENABLED: ${MERCADOPAGO_ENABLED:-false}
      # Fase 7: carga inicial y atención de historia clínica y recetas. Default false hasta el corte en mantenimiento.
      PROFESIONALES_CLINICA: ${PROFESIONALES_CLINICA:-false}
      # Fase 7: QBI2 para recetas electrónicas (las mismas variables y defaults que el monolito).
      QBI2_RECIPE_ENABLED: ${QBI2_RECIPE_ENABLED:-false}
      QBI2_RECIPE_ENV: ${QBI2_RECIPE_ENV:-hml}
      QBI2_CLIENTE_APP_ID: ${QBI2_CLIENTE_APP_ID:-}
      QBI2_RECIPE_TOKEN: ${QBI2_RECIPE_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # Arranque escalonado (sección 9.3): una JVM detrás de la otra.
    depends_on:
      db-servicios:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
      gateway:
        condition: service_healthy
      pagos:
        condition: service_healthy
    networks:
      tranqui-network:
        aliases:
          - tranqui-profesionales

  turnos:
    image: ghcr.io/tommikimmel/tranqui-turnos:${TRANQUI_VERSION:-latest}
    build:
      context: .
      dockerfile: services/turnos/Dockerfile
    container_name: tranqui-turnos
    restart: always
    mem_limit: 288m
    cpus: 0.5
    environment:
      TZ: America/Argentina/Buenos_Aires
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:MinRAMPercentage=30 -XX:MaxRAMPercentage=30 -Xss256k -XX:ReservedCodeCacheSize=32m -XX:MaxMetaspaceSize=128m -XX:TieredStopAtLevel=1"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://tranqui-db:5432/turnos
      SPRING_DATASOURCE_USERNAME: turnos
      SPRING_DATASOURCE_PASSWORD: ${TURNOS_DB_PASSWORD:?Falta TURNOS_DB_PASSWORD en .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-tranqui}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-/}
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      SERVICE_JWT_KEY: ${SERVICE_JWT_KEY:?Falta SERVICE_JWT_KEY en .env}
      TRANQUI_GATEWAY_URL: http://gateway:8080
      TRANQUI_VERSION: ${TRANQUI_VERSION:-latest}
      # Los mismos que el monolito: la reserva exige Mercado Pago vinculado (salvo con el pago simulado) y los
      # links de los mails de asistencia van a la URL pública.
      MERCADOPAGO_ENABLED: ${MERCADOPAGO_ENABLED:-false}
      PAYMENT_SIMULATION_ENABLED: ${PAYMENT_SIMULATION_ENABLED:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    # Arranque escalonado (sección 9.3): una JVM detrás de la otra.
    depends_on:
      db-servicios:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_healthy
      gateway:
        condition: service_healthy
      profesionales:
        condition: service_healthy
    networks:
      tranqui-network:
        aliases:
          - tranqui-turnos

  tranqui-frontend:
    image: ghcr.io/tommikimmel/tranqui-frontend:${TRANQUI_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tranqui-frontend
    restart: always
    mem_limit: 64m
    cpus: 0.5
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      # Modo mantenimiento: carpeta del host fuera de /app (un deploy no la borra). Ver
      # frontend/nginx.conf y docs/entornos/produccion.md. Docker la crea vacía si no existe.
      - /srv/tranqui/mantenimiento:/etc/nginx/mantenimiento:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tranqui-frontend.entrypoints=websecure"
      - "traefik.http.routers.tranqui-frontend.rule=Host(`tranquisalud.com`)"
      - "traefik.http.routers.tranqui-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.tranqui-frontend.loadbalancer.server.port=80"
    networks:
      - tranqui-network
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
  rabbitmq_data:
    driver: local
  consul_data:
    driver: local
  vmdata:
    driver: local

networks:
  tranqui-network:
    driver: bridge
