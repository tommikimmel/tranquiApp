spring:
  application:
    name: calendario
  # Sección 6.7: al apagarse termina lo que está procesando, hasta 20 s.
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/calendario}
    username: ${SPRING_DATASOURCE_USERNAME:calendario}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # Sección 9.2: pools chicos.
      maximum-pool-size: 5
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:tranqui}
    password: ${SPRING_RABBITMQ_PASSWORD:}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    # La outbox (libs/eventos) publica con confirmación del broker.
    publisher-confirm-type: correlated
    publisher-returns: true
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: ${CONSUL_DISCOVERY_ENABLED:true}
        service-name: calendario
        instance-id: ${spring.application.name}:${random.value}
        # Chequeo por TTL: el servicio le manda a Consul su salud del actuator cada 20 s. Si sigue
        # crítico más de un minuto (caído, o con la base caída) Consul lo da de baja, y en cuanto se
        # recupera el próximo latido lo vuelve a registrar. Con el chequeo HTTP de antes se registraba
        # una sola vez al arrancar: después de una baja seguía andando pero el gateway respondía 503.
        health-check-critical-timeout: 1m
        heartbeat:
          enabled: true
          ttl: 30s
          reregister-service-on-failure: true
        # Registro por IP: el gateway lo alcanza en la red de Docker sin resolver el hostname del contenedor.
        prefer-ip-address: true
        tags: version=${TRANQUI_VERSION:dev}

server:
  port: 8080
  tomcat:
    threads:
      max: 50
  shutdown: graceful

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,rabbit
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      servicio: calendario
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

# Eventos (libs/eventos): consume calendario.eventos (turnos e identidad) y publica por su outbox
# calendario.meet.creado.v1 y calendario.horario.bloqueado.v1.
eventos:
  consumo:
    servicio: calendario
  outbox:
    habilitada: true

# Las mismas propiedades que el monolito (MedicoController, GoogleCalendar*): mismo cliente OAuth,
# mismas URLs públicas (callback y webhook pasan por el gateway) y los mismos flags.
google:
  client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    watch:
      enabled: ${GOOGLE_CALENDAR_WATCH_ENABLED:false}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8081}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  local-simulations: false

calendario:
  carga-inicial:
    habilitada: true

jwt:
  # Misma clave que identidad (hoy el monolito) usa para firmar los JWT de usuario. Sin default.
  secret: ${JWT_SECRET:}

security:
  encryption:
    # La misma ENCRYPTION_KEY que el monolito: cifra los tokens de Google y firma el state y los
    # canales (Cifrado). Obligatoria, sin default.
    key: ${ENCRYPTION_KEY:}

tranqui:
  gateway:
    # Las consultas internas (carga inicial) pasan por el gateway (sección 4.2).
    url: ${TRANQUI_GATEWAY_URL:http://gateway:8080}
  jwt:
    service-secret: ${SERVICE_JWT_KEY:}

logging:
  level:
    root: INFO
