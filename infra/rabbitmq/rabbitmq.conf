# RabbitMQ configuration for Tranqui App (local)
# Memoria según sección 9.1 del plan de microservicios (256 MB con watermark 0.6)
vm_memory_high_watermark.relative = 0.6

# Carga de definiciones al arrancar
management.load_definitions = /etc/rabbitmq/definitions.json
definitions.import_backend = local
definitions.local.path = /etc/rabbitmq/definitions.json
