server:
  port: 8080

spring:
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        enabled: true
        service-name: gateway
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: /health
        health-check-interval: 10s

tranqui:
  services:
    monolito:
      uri: http://backend:8080
