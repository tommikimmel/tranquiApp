server:
  port: 8080

spring:
  data:
    redis:
      host: redis
      port: 6379
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        enabled: true
        service-name: gateway
        instance-id: ${spring.application.name}:${random.value}
        health-check-interval: 10s

tranqui:
  jwt:
    service-secret: ${SERVICE_JWT_KEY:local-service-jwt-secret-key-32chars}
  services:
    monolito:
      uri: http://backend:8080

jwt:
  secret: ${JWT_SECRET:local-dev-encryption-key-32chars}
