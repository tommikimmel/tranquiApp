# Deploy a producción al crear un tag vX.Y.Z sobre main (ver docs/flujo/releases.md).
# 1. Corre los tests (workflow CI). 2. Construye y publica las imágenes en GHCR.
# 3. Por SSH, el VPS baja las imágenes, recrea los contenedores y verifica; si falla, vuelve a la
#    versión anterior (scripts/vps/deploy-remoto.sh).
name: Deploy

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar-tag:
    name: El tag está en main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar que el commit del tag pertenezca a main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "El tag ${GITHUB_REF_NAME} no apunta a un commit de main: solo se despliega desde main." >&2
            exit 1
          fi

  tests:
    needs: verificar-tag
    uses: ./.github/workflows/ci.yml

  imagenes:
    name: Imágenes (${{ matrix.servicio }})
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.servicio }}
          push: true
          tags: |
            ghcr.io/tommikimmel/tranqui-${{ matrix.servicio }}:${{ github.ref_name }}
            ghcr.io/tommikimmel/tranqui-${{ matrix.servicio }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  desplegar:
    name: Desplegar ${{ github.ref_name }}
    needs: imagenes
    runs-on: ubuntu-latest
    environment: produccion
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copiar compose y script al VPS
        env:
          DESTINO: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy "$DESTINO" 'mkdir -p /srv/tranqui'
          scp -i ~/.ssh/deploy docker-compose.yml scripts/vps/deploy-remoto.sh "$DESTINO":/srv/tranqui/
      - name: Desplegar y verificar
        env:
          DESTINO: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
        run: ssh -i ~/.ssh/deploy "$DESTINO" "bash /srv/tranqui/deploy-remoto.sh '${GITHUB_REF_NAME}'"
      - name: Borrar la clave del runner
        if: always()
        run: rm -f ~/.ssh/deploy
