server:
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

spring:
  application:
    name: tranqui-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tranqui_app}
    username: ${SPRING_DATASOURCE_USERNAME:tomaskimmel}
    password: ${SPRING_DATASOURCE_PASSWORD:securepassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID:ACmockaccount}
  auth:
    token: ${TWILIO_AUTH_TOKEN:mocktoken}
  whatsapp:
    number: ${TWILIO_WHATSAPP_NUMBER:+14155238886}

google:
  client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    watch:
      enabled: ${GOOGLE_CALENDAR_WATCH_ENABLED:false}

mercadopago:
  enabled: ${MERCADOPAGO_ENABLED:false}
  client-id: ${MERCADOPAGO_CLIENT_ID:}
  client-secret: ${MERCADOPAGO_CLIENT_SECRET:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  sandbox: ${MERCADOPAGO_SANDBOX:true}

payment:
  simulation:
    enabled: ${PAYMENT_SIMULATION_ENABLED:false}

qbi2:
  recipe:
    enabled: ${QBI2_RECIPE_ENABLED:false}
    environment: ${QBI2_RECIPE_ENV:hml}
    base-url-hml: https://apirecipe.hml.qbitos.com
    base-url-prod: https://apirecipe.qbitos.com
    cliente-app-id: ${QBI2_CLIENTE_APP_ID:}
    token: ${QBI2_RECIPE_TOKEN:}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8081}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
