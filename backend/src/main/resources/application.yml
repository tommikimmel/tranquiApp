server:
  compression:
    enabled: true
    mime-types: application/json,text/plain
    min-response-size: 1024

spring:
  application:
    name: tranqui-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tranqui_app}
    username: ${SPRING_DATASOURCE_USERNAME:tomaskimmel}
    password: ${SPRING_DATASOURCE_PASSWORD:securepassword}
    driver-class-name: org.postgresql.Driver
  # Flyway corre antes que Hibernate. baseline-on-migrate: una base existente sin historial se
  # marca como versión 1 (el esquema que ya creó ddl-auto) y solo se le aplican V2 en adelante.
  # ddl-auto: update sigue creando tablas/columnas nuevas; los cambios destructivos (borrar o
  # renombrar columnas, migrar datos) van como migraciones en db/migration.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:tranqui}
    password: ${SPRING_RABBITMQ_PASSWORD:tranqui-local}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

management:
  # Actuator en un puerto propio que no se publica fuera de la red de Docker: lo usa
  # VictoriaMetrics para leer /actuator/prometheus (igual que el gateway).
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

eventos:
  relay:
    enabled: ${EVENTOS_RELAY_ENABLED:false}
    backup-poll-ms: ${EVENTOS_RELAY_BACKUP_POLL_MS:30000}
  cleaner:
    enabled: ${EVENTOS_CLEANER_ENABLED:true}
    cron: ${EVENTOS_CLEANER_CRON:0 0 3 * * ?}

google:
  client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    watch:
      enabled: ${GOOGLE_CALENDAR_WATCH_ENABLED:false}

mercadopago:
  enabled: ${MERCADOPAGO_ENABLED:false}
  client-id: ${MERCADOPAGO_CLIENT_ID:}
  client-secret: ${MERCADOPAGO_CLIENT_SECRET:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  # Cuenta del administrador/plataforma (Etapa 2 del paywall de suscripciones — todavía sin
  # código que las use). Access Token y Public Key directos de esa cuenta, no OAuth por-profesional.
  admin:
    access-token: ${MP_ADMIN_ACCESS_TOKEN:}
    public-key: ${MP_ADMIN_PUBLIC_KEY:}

payment:
  simulation:
    enabled: ${PAYMENT_SIMULATION_ENABLED:false}

qbi2:
  recipe:
    enabled: ${QBI2_RECIPE_ENABLED:false}
    environment: ${QBI2_RECIPE_ENV:hml}
    base-url-hml: https://apirecipe.hml.qbitos.com
    base-url-prod: https://apirecipe.qbitos.com
    cliente-app-id: ${QBI2_CLIENTE_APP_ID:}
    token: ${QBI2_RECIPE_TOKEN:}

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8081}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Siembra cuentas de prueba con password conocida (ver DataInitializer). Nunca en producción.
  seed-test-accounts: ${SEED_TEST_ACCOUNTS:false}
  # Password inicial de admin@tranqui.com (solo si la cuenta no existe). Sin default conocido.
  admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}
  # Datos de demo realistas (LocalDemoSeeder). Solo tienen efecto con el perfil "local".
  demo-data: ${DEMO_DATA:false}
  # Simulación de integraciones con OAuth real (Google Calendar). Solo true en el perfil "local".
  local-simulations: false

site:
  access:
    password: ${SITE_ACCESS_PASSWORD:}

# Transporte de los mails: "resend" (API de Resend, producción) o "smtp" (spring.mail.*, usado en
# el entorno local con Mailpit). Ver ResendEmailService.
mail:
  transport: ${MAIL_TRANSPORT:resend}

# Novedades: mail masivo al terminar un mantenimiento (Broadcasts de Resend). El token protege el
# endpoint interno que dispara el envío; solo vive en el .env del VPS. Ver docs/novedades.md.
novedades:
  token: ${NOVEDADES_TOKEN:}
  segmento-pacientes: Tranqui App - Pacientes
  segmento-profesionales: Tranqui App - Profesionales

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

jwt:
  secret: ${JWT_SECRET:}

# Fase 1: con false los mails y las notificaciones con evento los manda el servicio de
# notificaciones; true vuelve al envío directo desde el monolito (vuelta atrás).
notificaciones:
  envio-directo: ${NOTIFICACIONES_ENVIO_DIRECTO:false}

# Fase 3: con true, Google Calendar lo maneja el servicio de calendario (eventos y Meet por eventos,
# disponibilidad por /internal/calendario). Vuelta atrás: false y la ruta del gateway al monolito.
calendario:
  externo: ${CALENDARIO_EXTERNO:false}

# Fase 4: con true, Mercado Pago lo maneja el servicio de pagos (checkout, webhooks, reembolsos y
# cuentas de los profesionales, por eventos). Las suscripciones siguen acá hasta la Fase 8.
# Vuelta atrás: false y la ruta del gateway al monolito.
pagos:
  externo: ${PAGOS_EXTERNO:false}

# Fase 5: con true, el perfil, la disponibilidad, las tarifas y el buscador los administra el servicio de
# profesionales; el monolito guarda una copia (turnos lee de ahí) que se actualiza con sus eventos y con una
# resincronización cada resincronizacion-minutos. La identidad, la verificación y la suscripción siguen acá.
profesionales:
  externo: ${PROFESIONALES_EXTERNO:false}
  resincronizacion-minutos: ${PROFESIONALES_RESINCRONIZACION_MINUTOS:15}

# Fase 6: con true, los turnos los administra el servicio de turnos (reservas, agenda, cancelación,
# reprogramación, asistencia, documentos, el vencimiento del bloqueo y los recordatorios). El monolito guarda
# una copia de turno (estadísticas, historia clínica, recetas) que se actualiza con turnos.turno.actualizado
# y una resincronización cada resincronizacion-minutos.
turnos:
  externo: ${TURNOS_EXTERNO:false}
  resincronizacion-minutos: ${TURNOS_RESINCRONIZACION_MINUTOS:15}

# Fase 7: con true, la historia clínica, las recetas y los conceptos los administra el servicio de
# profesionales; las rutas del monolito responden 409 (ClinicaExternoFilter). Vuelta atrás: false.
clinica:
  externo: ${CLINICA_EXTERNO:false}

# Fase 8: con true, las suscripciones las administra el servicio de pagos (planes, suscripciones,
# webhooks, pagos, facturación y reconciliación); las rutas del monolito responden 409 (SuscripcionesExternoFilter).
# El monolito guarda una copia en suscripcion_acceso que se actualiza con
# suscripciones.suscripcion.cambio-estado.v2 y una resincronización cada resincronizacion-minutos.
suscripciones:
  externo: ${SUSCRIPCIONES_EXTERNO:false}
  resincronizacion-minutos: ${SUSCRIPCIONES_RESINCRONIZACION_MINUTOS:15}

tranqui:
  jwt:
    # JWT de servicio (sección 4.2) para las rutas /internal/** que consultan otros servicios.
    service-secret: ${SERVICE_JWT_KEY:}
  gateway:
    # Fase 2: consultas internas a otros servicios (resumen de chat). Vacío: usa las tablas propias.
    url: ${TRANQUI_GATEWAY_URL:}
