spring:
  application:
    name: tranqui-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tranqui_app}
    username: ${SPRING_DATASOURCE_USERNAME:tomaskimmel}
    password: ${SPRING_DATASOURCE_PASSWORD:securepassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
