<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Tranqui App — En mantenimiento</title>
  <link rel="icon" href="/__mantenimiento/logo.webp" />
  <!-- Página que nginx muestra mientras el modo mantenimiento está activo (ver frontend/nginx.conf).
       Autocontenida: no depende del backend ni del build de React. -->
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #172B1F;
      background: radial-gradient(circle at 30% 20%, #EAF6EE, #FBFCFA 60%);
    }
    main {
      width: 100%;
      max-width: 480px;
      text-align: center;
      background: #fff;
      border: 1px solid #E7EEE9;
      border-radius: 20px;
      padding: 40px 28px;
      box-shadow: 0 12px 32px rgba(30, 122, 60, .10), 0 2px 8px rgba(23, 43, 31, .05);
    }
    .marca { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; color: #2FA84F; margin-bottom: 28px; }
    .marca img { width: 40px; height: 40px; border-radius: 10px; }
    .icono { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: #EAF6EE; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 24px; line-height: 1.25; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.55; color: rgba(23, 43, 31, .72); margin: 0; }
    #mensaje { margin-top: 16px; font-weight: 600; color: #1E7A3C; }
    #mensaje:empty { display: none; }
    .pie { margin-top: 28px; font-size: 13px; color: rgba(23, 43, 31, .5); }
    .pie a { color: #1E7A3C; }
  </style>
</head>
<body>
  <main>
    <div class="marca"><img src="/__mantenimiento/logo.webp" alt="" />tranquiApp</div>
    <div class="icono" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#1E7A3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg>
    </div>
    <h1>Estamos haciendo mejoras para vos</h1>
    <p>Volvemos en unos minutos. Gracias por la paciencia.</p>
    <p id="mensaje" role="status"></p>
    <p class="pie">Si estás atravesando una crisis, no esperes: llamá gratis al <a href="tel:135">135</a> (Centro de Asistencia al Suicida) o al <a href="tel:107">107</a> (emergencias médicas), las 24 horas.</p>
  </main>
  <script>
    // Mensaje opcional que se carga al prender el mantenimiento (npm run mantenimiento -- on "...").
    fetch('/__mantenimiento/info.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null })
      .then(function (info) {
        if (info && typeof info.mensaje === 'string' && info.mensaje.trim()) {
          document.getElementById('mensaje').textContent = info.mensaje.trim()
        }
      })
      .catch(function () {})
  </script>
</body>
</html>
