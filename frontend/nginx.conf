# --- Modo mantenimiento (ver docs/entornos/produccion.md) -------------------------------------
# La carpeta /etc/nginx/mantenimiento es un volumen del host (/srv/tranqui/mantenimiento en el VPS),
# fuera de /app para que un deploy no la borre. Contiene, solo mientras el mantenimiento está activo:
#   activo      flag: si existe, el sitio muestra la página de mantenimiento (503)
#   info.json   mensaje opcional que muestra la página
#   token.conf  `set $mant_token "...";` con el token del acceso de administrador
# Se maneja con `npm run mantenimiento -- on|off|estado`.

server {
    listen 80;
    server_name localhost;
    # Redirecciones relativas: detrás de Traefik (TLS) nginx no sabe que el sitio es https.
    absolute_redirect off;

    # Text compression: Lighthouse flags the document response for not being compressed. Static
    # JS/CSS bundles are the biggest win (Vite ships them unminified-adjacent in size before gzip).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml text/vtt;

    # Token del acceso de administrador. Sin token cargado, un valor distinto en cada pedido que
    # ninguna cookie puede igualar.
    set $mant_token "";
    include /etc/nginx/mantenimiento/*.conf;
    if ($mant_token = "") {
        set $mant_token $request_id;
    }

    # Rutas que nunca se bloquean: la propia página de mantenimiento y el acceso de administrador.
    # Con set/if y no con map: el valor de un map queda cacheado durante todo el pedido y la
    # redirección interna del error_page volvería a bloquearse.
    set $mant_ruta_libre 0;
    if ($uri ~ ^/__mantenimiento/) {
        set $mant_ruta_libre 1;
    }
    if ($uri = /__acceso-mantenimiento) {
        set $mant_ruta_libre 1;
    }

    set $mant_activo 0;
    if (-f /etc/nginx/mantenimiento/activo) {
        set $mant_activo 1;
    }
    set $mant_admin 0;
    if ($cookie_tranqui_mant = $mant_token) {
        set $mant_admin 1;
    }
    # Bloquea si está activo, no es una ruta libre y no es el administrador ("100").
    set $mant_bloqueo "$mant_activo$mant_ruta_libre$mant_admin";
    if ($mant_bloqueo = "100") {
        return 503;
    }
    # Aviso para el administrador que navega el sitio durante el mantenimiento ("101").
    set $mant_aviso "";
    if ($mant_bloqueo = "101") {
        set $mant_aviso '<div style="position:fixed;left:12px;bottom:12px;z-index:2147483647;background:#C98A1B;color:#fff;font:600 13px/1.3 Inter,system-ui,sans-serif;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.2)">Modo mantenimiento activo: solo vos ves el sitio</div>';
    }

    error_page 503 /__mantenimiento/index.html;

    # Página de mantenimiento (frontend/public/mantenimiento/). ^~ para que las reglas de cache de
    # imágenes de abajo no la intercepten.
    location ^~ /__mantenimiento/ {
        alias /usr/share/nginx/html/mantenimiento/;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "600" always;
    }

    location = /__mantenimiento/info.json {
        alias /etc/nginx/mantenimiento/info.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # Acceso de administrador: con el token correcto deja la cookie y redirige al inicio.
    location = /__acceso-mantenimiento {
        if ($arg_token != $mant_token) {
            return 403;
        }
        add_header Set-Cookie "tranqui_mant=$mant_token; Path=/; Max-Age=86400; Secure; HttpOnly; SameSite=Lax";
        return 302 /;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Default fallback for index.html
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

        sub_filter '</body>' '$mant_aviso</body>';
        sub_filter_once on;
    }

    # Cache hashed static assets (JS, CSS) forever since their filenames change on build
    location ~* \.(?:css|js)$ {
        root /usr/share/nginx/html;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache media assets
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Help-center videos and their subtitles. Browsers expect text/vtt for <track>, which the
    # default mime.types doesn't map. No index.html fallback: a missing video should be a 404.
    # Filenames aren't hashed, so cache for a day only.
    location /videos/ {
        root /usr/share/nginx/html;
        types {
            video/webm webm;
            text/vtt vtt;
        }
        expires 1d;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
